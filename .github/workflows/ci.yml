name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A single self-hosted runner serializes all jobs; cancel superseded runs of
# the same ref so a rapid push train doesn't queue up stale verifications.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Self-hosted runner has no passwordless sudo, so we can't use
      # `--with-deps` (it runs apt-get as root). Download just the browser
      # binary; its system libraries must already exist on the runner host.
      # One-time host setup if the launch below fails on missing libs:
      #   sudo pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright install chromium
      - run: pnpm verify:playground
