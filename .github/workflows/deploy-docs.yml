name: Deploy Docs to Netlify

# Deploys the VitePress docs site to Netlify prod once per release, not on every
# push. Each production deploy costs 15 Netlify credits (the Personal plan has
# 1,000 a month, the free plan 300). Deploying on every push to main used up the
# free plan in September 2026 (19 deploys), and at zero Netlify pauses the site
# until the monthly reset.
#
# When it runs:
# - on the `@michi-vz/core@<version>` tag, which `git push origin --tags` sends
#   AFTER `pnpm release` has put the packages on npm, so the docs never announce
#   a version npm does not have yet. Every release that bumps core has this tag.
# - by hand (Actions tab, or `gh workflow run deploy-docs.yml`): a release that
#   does not bump core, or a docs-only fix worth a deploy.
#
# The job targets the `docs-production` Environment. If that Environment has
# required reviewers, each run waits for approval before it deploys.
#
# Requires secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID (repo- or
# environment-scoped).
on:
  push:
    tags:
      - "@michi-vz/core@*"
  workflow_dispatch:

# Cancel an in-progress docs deploy when a newer one starts.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    environment:
      name: docs-production
      url: ${{ steps.deploy.outputs.deploy_url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate Netlify secrets
        shell: bash
        run: |
          [ -n "$NETLIFY_AUTH_TOKEN" ] || { echo "❌ NETLIFY_AUTH_TOKEN missing"; exit 1; }
          [ -n "$NETLIFY_SITE_ID" ]   || { echo "❌ NETLIFY_SITE_ID missing"; exit 1; }
          echo "✅ Netlify secrets present"

      - run: pnpm install --frozen-lockfile

      # Builds the docs package and its workspace deps in dependency order.
      # GA_MEASUREMENT_ID / GOOGLE_SITE_VERIFICATION are read from process.env
      # at build time (see apps/docs/.vitepress/config.ts). They must be present
      # HERE or the analytics + Search Console tags are silently omitted. Both
      # values end up in the public page source, so they are not truly secret,
      # but we source them from secrets to keep them out of the open-source repo.
      - name: Build docs
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: pnpm --filter "docs..." build

      - name: Deploy to Netlify (prod)
        id: deploy
        # --filter docs: this is a pnpm monorepo, so the Netlify CLI detects
        # many packages and refuses to guess which one; --filter names the
        # package (its package.json "name" is "docs"). Site linkage comes from
        # NETLIFY_SITE_ID. --dir is absolute so the filter's base can't skew it.
        run: >
          pnpm --package=netlify-cli dlx netlify deploy
          --filter docs
          --dir="${{ github.workspace }}/apps/docs/.vitepress/dist"
          --prod
          --message "Deploy ${{ github.ref_name }} (${{ github.sha }})"
