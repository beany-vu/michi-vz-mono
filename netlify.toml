# Netlify config for the @michi-vz docs site.
#
# Deploy model: the site is built in GitHub Actions (deploy-docs.yml, which
# bakes in the analytics secrets) and UPLOADED prebuilt via the Netlify CLI.
# A local docker build + `pnpm deploy:docs` remains available as a manual
# fallback (never build docs on the WSL host - root-owned dist quirk). So
# Netlify itself must NOT build - it just serves the uploaded folder. The
# build command is therefore a no-op.
#
# To switch back to Netlify's own git-triggered build, restore:
#   command = "pnpm install --frozen-lockfile && pnpm --filter \"docs...\" build"
# ("--filter docs..." builds the docs package AND its workspace deps in order.)
[build]
  command = "echo 'Prebuilt locally and uploaded via the Netlify CLI - skipping Netlify build.'"
  publish = "apps/docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "20"

# Allow example JSON to be fetched cross-origin later (CodePen, embeds).
[[headers]]
  for = "/examples/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
